# Copy to secrets.yaml (git-ignored) next to sp200a-8048S050.yaml and fill in
# real values. ESPHome resolves every `!secret` key in the config from it.

# Home Wi-Fi the panel joins for flashing, OTA and the web UI.
wifi_iot_ssid: "REPLACE_WITH_HOME_WIFI_NAME"
wifi_iot_password: "REPLACE_WITH_HOME_WIFI_PASSWORD"

# Always-on access point the phone joins for NMEA (Navionics pairs to
# 192.168.4.1:10110). WPA2 needs 8 to 63 characters; use a unique passphrase,
# never the T-Box factory default.
phone_ap_ssid: "SonarDisplay"
phone_ap_password: "REPLACE_WITH_UNIQUE_PASSPHRASE"
