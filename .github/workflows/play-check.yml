name: Play Check

# Read existing versions and authoritative signing metadata, without publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

# CI-6: Play allows one open edit per app, so edit-opening workflows queue here, never cancel, and queue: max keeps a waiting release from being dropped.
concurrency:
  group: google-play-edit
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false
      - name: Inspect releases and signing metadata
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-status.mjs
