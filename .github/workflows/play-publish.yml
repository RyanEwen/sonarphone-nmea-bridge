name: play-publish

# Reusable Play build and upload lane. Tags call it from release.yml; manual
# runs can still update a testing track or sync only the store listing.
# Keep the existing internal-testing default until production is approved.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      track:
        default: internal
        type: string
      inspect_only:
        default: false
        type: boolean
      listing_only:
        default: false
        type: boolean
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to build (e.g. v0.2.3), required unless listing_only'
        required: false
      track:
        description: 'Play track'
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      inspect_only:
        description: 'Read current tracks, version codes and signing metadata without publishing'
        default: false
        type: boolean
      listing_only:
        description: 'Only sync listing text/graphics/screenshots (no AAB build/upload)'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ inputs.inspect_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Inspect releases and signing metadata
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-status.mjs

  publish:
    if: ${{ !inputs.inspect_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Resolve version + Play versionCode
        id: ver
        env:
          TAG: ${{ inputs.version }}
          LISTING_ONLY: ${{ inputs.listing_only }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.PLAY_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is required"; exit 1; }
          [ "$LISTING_ONLY" = "true" ] && exit 0
          [[ "${PLAY_SIGNING_CERTIFICATE_SHA256//:/}" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Set PLAY_SIGNING_CERTIFICATE_SHA256 to the Play app-signing fingerprint"; exit 1; }
          bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: ${{ !inputs.listing_only }}
        with:
          node-version: 24

      - name: Check Play versionCode before building
        if: ${{ !inputs.listing_only }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: node scripts/play-status.mjs

      - name: Generate changelog for this version
        if: ${{ steps.ver.outputs.code != '' }}
        env:
          TAG: ${{ inputs.version }}
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          bash scripts/release-notes.sh "$TAG" play > "fastlane/metadata/android/en-US/changelogs/${{ steps.ver.outputs.code }}.txt"

      # ---- build the Play AAB (skipped for listing-only) ----
      - uses: actions/setup-java@v5
        if: ${{ !inputs.listing_only }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: ${{ !inputs.listing_only }}

      # explicit so a runner image without android-36 can't fail the build
      - name: Install SDK platform 36
        if: ${{ !inputs.listing_only }}
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Decode release keystore
        if: ${{ !inputs.listing_only }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed Play AAB
        if: ${{ !inputs.listing_only }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew --no-daemon bundlePlayRelease

      # ---- publish via Fastlane supply ----
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Write service-account key
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_KEY" > "$RUNNER_TEMP/play-key.json"

      - name: Upload AAB + sync listing
        if: ${{ !inputs.listing_only }}
        env:
          PLAY_TRACK: ${{ inputs.track }}
        run: |
          fastlane supply \
            --package_name ca.dynamicsolutions.sonarbridge \
            --json_key "$RUNNER_TEMP/play-key.json" \
            --aab android/app/build/outputs/bundle/playRelease/app-play-release.aab \
            --track "$PLAY_TRACK" \
            --release_status completed \
            --metadata_path fastlane/metadata/android

      - name: Sync listing only (no AAB)
        if: ${{ inputs.listing_only }}
        env:
          PLAY_TRACK: ${{ inputs.track }}
        run: |
          fastlane supply \
            --package_name ca.dynamicsolutions.sonarbridge \
            --json_key "$RUNNER_TEMP/play-key.json" \
            --track "$PLAY_TRACK" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --metadata_path fastlane/metadata/android
