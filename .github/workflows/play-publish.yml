name: Publish to Google Play

# Reusable Play build and upload lane. A tag (release.yml) uploads the bundle to
# production as a draft; publishing is a second, deliberate run of this workflow
# with publish_draft, which checks the draft against the tag (REL-7). Manual runs
# can also upload to a testing track or sync only the store listing.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      track:
        default: production
        type: string
      release_status:
        default: draft
        type: string
      inspect_only:
        default: false
        type: boolean
      listing_only:
        default: false
        type: boolean
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (e.g. v0.2.7); required unless listing_only'
        required: false
      publish_draft:
        description: 'Send the production draft created by this tag to review (no build or upload)'
        default: false
        type: boolean
      track:
        description: 'Play track for an upload'
        default: 'production'
        type: choice
        options: [internal, alpha, beta, production]
      release_status:
        description: 'draft holds the upload in Play Console; completed releases it on that track'
        default: 'draft'
        type: choice
        options: [draft, completed]
      inspect_only:
        description: 'Read current tracks, version codes and signing metadata without publishing'
        default: false
        type: boolean
      listing_only:
        description: 'Only sync listing text/graphics/screenshots (no AAB build/upload)'
        default: false
        type: boolean

permissions:
  contents: read

# Uploads publish; never cancel. When called from release.yml the caller's
# concurrency group applies as well.
concurrency:
  group: play-publish-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  # Second, deliberate release step (REL-7): commit the tag's production draft for review.
  publish-draft:
    if: ${{ inputs.publish_draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', inputs.version) }}
      - name: Resolve Play versionCode from the tag
        id: ver
        env:
          TAG: ${{ inputs.version }}
        run: bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false
      - name: Send the production draft to review
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: node scripts/play-publish-draft.mjs

  inspect:
    if: ${{ inputs.inspect_only && !inputs.publish_draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false
      - name: Inspect releases and signing metadata
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-status.mjs

  upload:
    if: ${{ !inputs.inspect_only && !inputs.publish_draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Resolve version + Play versionCode
        id: ver
        env:
          TAG: ${{ inputs.version }}
          LISTING_ONLY: ${{ inputs.listing_only }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.PLAY_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is required"; exit 1; }
          [ "$LISTING_ONLY" = "true" ] && exit 0
          [[ "${PLAY_SIGNING_CERTIFICATE_SHA256//:/}" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Set PLAY_SIGNING_CERTIFICATE_SHA256 to the Play app-signing fingerprint"; exit 1; }
          bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: ${{ !inputs.listing_only }}
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false

      - name: Check Play versionCode before building
        if: ${{ !inputs.listing_only }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: node scripts/play-status.mjs

      # Committed notes only (REL-6): fails here, before building, if any locale is missing or too long.
      - name: Write Play "What's new" from release-notes/
        if: ${{ steps.ver.outputs.code != '' }}
        env:
          TAG: ${{ inputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: node scripts/release-notes.mjs play "$TAG" "$CODE" fastlane/metadata/android

      # ---- build the Play AAB (skipped for listing-only) ----
      - uses: actions/setup-java@v5
        if: ${{ !inputs.listing_only }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: ${{ !inputs.listing_only }}

      # explicit so a runner image without android-36 can't fail the build
      - name: Install SDK platform 36
        if: ${{ !inputs.listing_only }}
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Decode release keystore
        if: ${{ !inputs.listing_only }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed Play AAB
        if: ${{ !inputs.listing_only }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew --no-daemon bundlePlayRelease

      # ---- publish via Fastlane supply ----
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Write service-account key
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_KEY" > "$RUNNER_TEMP/play-key.json"

      - name: Upload AAB + sync listing
        if: ${{ !inputs.listing_only }}
        env:
          PLAY_TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          fastlane supply \
            --package_name ca.dynamicsolutions.sonarbridge \
            --json_key "$RUNNER_TEMP/play-key.json" \
            --aab android/app/build/outputs/bundle/playRelease/app-play-release.aab \
            --track "$PLAY_TRACK" \
            --release_status "$RELEASE_STATUS" \
            --metadata_path fastlane/metadata/android

      - name: Sync listing only (no AAB)
        if: ${{ inputs.listing_only }}
        env:
          PLAY_TRACK: ${{ inputs.track }}
        run: |
          fastlane supply \
            --package_name ca.dynamicsolutions.sonarbridge \
            --json_key "$RUNNER_TEMP/play-key.json" \
            --track "$PLAY_TRACK" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --metadata_path fastlane/metadata/android
