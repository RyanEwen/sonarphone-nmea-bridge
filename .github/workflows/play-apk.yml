name: Replace GitHub APK

# Re-export an already uploaded Play version. Never rebuild or upload a bundle,
# and preserve the release notes approved for the existing GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Android release tag (vX.Y.Z)'
        required: true
        type: string
      version_code:
        description: 'Existing Google Play versionCode for that release'
        required: true
        type: string

permissions:
  contents: read

# Replacing an asset publishes; never cancel a run part-way.
concurrency:
  group: play-apk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Waiting for Google's universal APK can take up to about 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install matching APK inspection tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Resolve existing release and inspection tools
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          # v0.2.4 is the final legacy-key APK; old installs and the migration guide still link to it.
          [ "$TAG" != "v0.2.4" ] || { echo "::error::Keep the final legacy migration APK available"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "AAPT=$BUILD_TOOLS/aapt" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"
      - name: Download and verify Google-signed APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.PLAY_SIGNING_CERTIFICATE_SHA256 }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node scripts/play-apk.mjs \
            --version-code "$VERSION_CODE" --version "$VERSION" \
            --output "sonarbridge-$VERSION-play.apk"
      - name: Replace direct APK
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload the verified replacement before deleting the legacy asset.
          gh release upload "$TAG" "sonarbridge-$VERSION-play.apk" --clobber --repo "$GITHUB_REPOSITORY"
          DIRECT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"sonarbridge-$VERSION.apk\") | .id")
          if [ -n "$DIRECT_ID" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$DIRECT_ID"
          fi
