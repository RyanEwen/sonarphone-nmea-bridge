name: Export Play APK

# Fetch Google's signed universal APK for an uploaded Play version, verify its
# package, version and signer, and keep it as a private workflow artifact. It is
# never attached to a GitHub Release: SonarBridge is distributed only through
# Google Play. The artifact is for capturing store screenshots from the shipped
# build (store-assets/README.md). release.yml calls this after the Play upload;
# run it by hand for an older tag once its artifact has expired.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Android release tag (vX.Y.Z) already uploaded to Play'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: play-apk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    # Waiting for Google's universal APK can take up to about 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - name: Resolve version + Play versionCode
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install APK inspection tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download and verify Google-signed APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.PLAY_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          export AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          node scripts/play-apk.mjs \
            --version-code "${{ steps.ver.outputs.code }}" \
            --version "${{ steps.ver.outputs.name }}" \
            --output "sonarbridge-${{ steps.ver.outputs.name }}-play.apk"

      # Private to people with access to the repository's Actions runs; GitHub keeps it for 90 days at most.
      - uses: actions/upload-artifact@v7
        with:
          name: sonarbridge-${{ steps.ver.outputs.name }}-play-apk
          path: sonarbridge-${{ steps.ver.outputs.name }}-play.apk
          if-no-files-found: error
          retention-days: 90
