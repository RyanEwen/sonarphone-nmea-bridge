name: release

# Build/upload the Play bundle first. Publish only Google's verified universal
# APK on GitHub, with the same package, version and signing identity as Play.
# No upload-key APK fallback is permitted.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to build (e.g. v0.2.0)'
        required: true
      legacy_migration:
        description: 'Publish the final upload-key APK with migration guidance'
        default: false
        type: boolean

permissions:
  contents: write

# A duplicate tag run must not race another build/upload of the same version.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  play:
    if: ${{ !inputs.legacy_migration && (vars.LEGACY_MIGRATION_TAG == '' || (inputs.version || github.ref_name) != vars.LEGACY_MIGRATION_TAG) }}
    uses: ./.github/workflows/play-publish.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      track: internal
      listing_only: false
    secrets: inherit

  android:
    needs: play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0 # full history + tags for the changelog

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: bash scripts/release-notes.sh "$TAG" > RELEASE_NOTES.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      # explicit so a runner image without android-36 can't fail the tag build
      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download and verify Google-signed APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.PLAY_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          export AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          node scripts/play-apk.mjs \
            --version-code "${{ steps.ver.outputs.code }}" \
            --version "${{ steps.ver.outputs.name }}" \
            --output "sonarbridge-${{ steps.ver.outputs.name }}-play.apk"

      - name: Add migration guidance
        run: |
          cat docs/android-migration-release-notes.md >> RELEASE_NOTES.md
          printf '\n*AI disclosure: this comment and the related code were written with the assistance of AI.*\n' >> RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: sonarbridge-*-play.apk
          # Old updaters must still find the final migration APK during the transition.
          make_latest: ${{ vars.KEEP_LEGACY_MIGRATION_LATEST == 'true' && 'false' || 'true' }}

  legacy-migration:
    if: ${{ inputs.legacy_migration || (vars.LEGACY_MIGRATION_TAG != '' && (inputs.version || github.ref_name) == vars.LEGACY_MIGRATION_TAG) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0 # full history + tags for the changelog

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: bash scripts/release-notes.sh "$TAG" > RELEASE_NOTES.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      # explicit so a runner image without android-36 can't fail the tag build
      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        # One final APK signed by the legacy key, so existing installations
        # can receive migration guidance without first clearing their settings.
        run: ./gradlew --no-daemon assembleGithubRelease

      - name: Verify legacy signing key
        env:
          EXPECTED_CERTIFICATE: d9becadd573cde4424c7cc92a088f7a74fec231761d314d1eda2601cc4bef3c9
        run: |
          CERTIFICATE=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            android/app/build/outputs/apk/github/release/app-github-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "${CERTIFICATE,,}" = "$EXPECTED_CERTIFICATE" ] || { echo "::error::Legacy APK signer changed; existing GitHub installs cannot update"; exit 1; }

      - name: Stage APK
        # flavored output dir is apk/<flavor>/<buildType>/, not apk/<flavorBuildType>/
        run: |
          cp android/app/build/outputs/apk/github/release/app-github-release.apk \
             "sonarbridge-${{ steps.ver.outputs.name }}.apk"

      - name: Add migration guidance
        run: |
          cat docs/android-migration-release-notes.md >> RELEASE_NOTES.md
          printf '\n*AI disclosure: this comment and the related code were written with the assistance of AI.*\n' >> RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: sonarbridge-*.apk
          make_latest: true
