name: Release

# A vX.Y.Z tag runs the gate, uploads the Play bundle to production as a draft,
# then publishes a GitHub Release with the committed notes and a link to Google
# Play. SonarBridge is distributed only through Play, so the release carries no
# APK; Google's verified APK is kept as a private workflow artifact for store
# screenshots. Sending the Play draft to review is a separate, deliberate run of
# the Publish to Google Play workflow (REL-7).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to build (e.g. v0.2.7)'
        required: true

permissions:
  contents: read

# A duplicate tag run must not race another build/upload of the same version.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The same gate as ci.yml, on the tag being released, before anything publishes (CI-4).
  # Jobs that call a reusable workflow cannot set timeout-minutes; the called jobs do.
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}

  play:
    needs: validate
    uses: ./.github/workflows/play-publish.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      track: production
      release_status: draft
      listing_only: false
    secrets: inherit

  # Google's signed APK, verified and kept as a private artifact (play-apk.yml).
  apk:
    needs: play
    uses: ./.github/workflows/play-apk.yml
    with:
      tag: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  github-release:
    needs: play
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false

      # Committed en-US notes, the Google Play link and the D-097 disclosure line.
      - name: Write release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: node scripts/release-notes.mjs github "$TAG" > RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SonarBridge ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
