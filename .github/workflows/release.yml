name: Release

# A vX.Y.Z tag runs the gate, uploads the Play bundle to production as a draft,
# then publishes Google's verified universal APK on GitHub with the committed
# release notes. Sending the Play draft to review is a separate, deliberate run of
# the Publish to Google Play workflow (REL-7). No upload-key APK fallback exists.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to build (e.g. v0.2.7)'
        required: true

permissions:
  contents: read

# A duplicate tag run must not race another build/upload of the same version.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The same gate as ci.yml, on the tag being released, before anything publishes (CI-4).
  # Jobs that call a reusable workflow cannot set timeout-minutes; the called jobs do.
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}

  play:
    needs: validate
    uses: ./.github/workflows/play-publish.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      track: production
      release_status: draft
      listing_only: false
    secrets: inherit

  android:
    needs: play
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Waiting for Google's universal APK can take up to about 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: bash scripts/release-version.sh "$TAG" >> "$GITHUB_OUTPUT"


      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # explicit so a runner image without android-36 can't fail the tag build
      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false

      - name: Download and verify Google-signed APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.PLAY_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          export AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          node scripts/play-apk.mjs \
            --version-code "${{ steps.ver.outputs.code }}" \
            --version "${{ steps.ver.outputs.name }}" \
            --output "sonarbridge-${{ steps.ver.outputs.name }}-play.apk"

      # Committed en-US notes, the get-it section and the D-097 disclosure line.
      - name: Write release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: node scripts/release-notes.mjs github "$TAG" > RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SonarBridge ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: sonarbridge-*-play.apk
          make_latest: true
