name: CI

# The push and pull request gate: the same `npm run validate` developers run
# locally. release.yml calls it before anything is published (CI-4).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to validate (the release tag when called from release.yml)'
        required: false
        type: string

permissions:
  contents: read

# github.workflow is the caller's name when this runs as a reusable workflow,
# so a release's gate gets its own group and is never cancelled; only plain CI
# runs cancel the run they replace.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Cold Gradle and Robolectric caches dominate; a warm run takes about ten minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No lockfile (no dependencies), so nothing to cache; setup-node would fail looking for one.
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      # Gradle's dependency and wrapper caches, so a run downloads only what changed. Without it
      # every run pulled the whole tree from Maven Central and hit its per-IP rate limit (429).
      # `basic` is the open-source provider on the GitHub Actions cache. Runs off the default
      # branch (tags, PRs) only read the cache (CI-6).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # explicit so a runner image without android-36 can't fail the build
      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Validate
        run: npm run validate
